[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "car-interface"
version = "0.1.0"
description = "Safety-oriented desktop control interface for an ESP32-based vehicle"
readme = "README.md"
requires-python = ">=3.13,<3.14"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pygame>=2.6.1,<3",
  "pyserial>=3.5,<4",
  "rplidar-roboticia>=0.9.5,<1",
]

[project.scripts]
car-interface = "car_interface.cli:main"

[project.urls]
Documentation = "https://github.com/Mohemed-Amine-Chalhy/Car_Interface/tree/main/docs"
Issues = "https://github.com/Mohemed-Amine-Chalhy/Car_Interface/issues"
Source = "https://github.com/Mohemed-Amine-Chalhy/Car_Interface"

[dependency-groups]
dev = [
  "bandit[toml]>=1.8.6,<2",
  "cyclonedx-bom>=7.1,<8",
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.12,<1",
  "types-pyserial>=3.5.0.20250326,<4",
]
build = [
  "build>=1.3,<2",
  "hatchling>=1.27,<2",
  "pyinstaller>=6.15,<7",
]

[tool.uv]
required-version = ">=0.8.15,<0.12"
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/car_interface"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]
include = [
  "main.py",
  "pyproject.toml",
  "src/**/*.py",
  "tests/**/*.py",
  "scripts/**/*.py",
]
force-exclude = true

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "DTZ",
  "E",
  "F",
  "FA",
  "FLY",
  "FURB",
  "I",
  "INT",
  "ISC",
  "LOG",
  "PERF",
  "PGH",
  "PIE",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T10",
  "UP",
  "W",
  "YTT",
]
ignore = [
  "ISC001", # Conflicts with the formatter.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/**/*.py" = ["S603", "S607", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["car_interface"]

[tool.mypy]
python_version = "3.13"
files = ["src/car_interface", "scripts", "main.py"]
mypy_path = "src"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unreachable = true
warn_unused_configs = true
exclude = [
  '(^|[\\/])(?:build|dist)([\\/]|$)',
]

[[tool.mypy.overrides]]
module = [
  "pygame.*",
  "rplidar.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--timeout=30",
  "-m=not hardware",
  "--cov=car_interface",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml:.reports/coverage.xml",
  "--cov-fail-under=80",
]
markers = [
  "gui: tests that require a graphical display",
  "hardware: opt-in tests that can access or move physical hardware",
  "integration: tests spanning multiple application components",
  "slow: tests that take more than a few seconds",
]

[tool.coverage.run]
branch = true
source = ["car_interface"]
parallel = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.paths]
source = [
  "src/car_interface",
  "*/site-packages/car_interface",
]

[tool.bandit]
targets = ["src/car_interface", "scripts", "main.py"]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101"]
