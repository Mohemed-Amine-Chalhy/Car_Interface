name: Bug report
description: Report a reproducible problem in the application, simulation, or hardware integration.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use the private advisory link in SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Simulation
        - Desktop UI
        - Controller
        - Serial or firmware protocol
        - RPLidar
        - Physical vehicle
        - Build, packaging, or developer tooling
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Expected and observed behavior
      description: Explain what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable example.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python/app version, configuration, and relevant device or firmware versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or traces
      description: Add concise evidence and remove personal or machine-specific data.
  - type: dropdown
    id: hardware_impact
    attributes:
      label: Does this affect physical hardware?
      options:
        - No
        - Yes
        - Unknown
    validations:
      required: true
