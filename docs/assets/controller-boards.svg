<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Installed ESP32 and Arduino controller boards</title>
  <desc id="desc">Documentation diagram comparing the ESP32-WROOM-32 development board and Arduino Uno R3-style board used in the project vehicle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2f"/>
      <stop offset="1" stop-color="#0f2942"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity="0.35"/></filter>
    <style>
      .title { font: 700 34px Inter,Segoe UI,Arial,sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 16px Inter,Segoe UI,Arial,sans-serif; fill: #a9bad0; }
      .cardtitle { font: 700 24px Inter,Segoe UI,Arial,sans-serif; fill: #f8fafc; }
      .body { font: 400 14px Inter,Segoe UI,Arial,sans-serif; fill: #d5deea; }
      .small { font: 700 11px Inter,Segoe UI,Arial,sans-serif; letter-spacing: .8px; fill: #e0f2fe; }
      .chip { font: 700 13px Consolas,monospace; fill: #dbeafe; }
    </style>
  </defs>
  <rect width="1200" height="675" rx="24" fill="url(#bg)"/>
  <text x="64" y="64" class="title">Installed Embedded Controllers</text>
  <text x="64" y="92" class="subtitle">ESP32-WROOM-32 and Arduino Uno R3 platform used in the 2025 vehicle</text>

  <!-- ESP32 card -->
  <g filter="url(#shadow)">
    <rect x="62" y="132" width="476" height="442" rx="24" fill="#10253b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="88" y="156" width="150" height="22" rx="11" fill="#075985"/>
    <text x="104" y="171" class="small">CONFIRMED BOARD FAMILY</text>
    <text x="88" y="216" class="cardtitle">ESP32-WROOM-32 Dev Board</text>
    <text x="88" y="241" class="body">38-pin DevKit-style carrier • CP2102 USB-UART</text>

    <!-- stylized board -->
    <rect x="100" y="279" width="188" height="212" rx="18" fill="#101827" stroke="#64748b" stroke-width="2"/>
    <rect x="128" y="302" width="132" height="90" rx="5" fill="#b8c1cc"/>
    <path d="M142 302v-13h104v13" fill="#263747"/>
    <text x="153" y="342" class="chip" fill="#1e293b">ESP-WROOM-32</text>
    <text x="157" y="365" class="chip" fill="#334155">RF MODULE</text>
    <rect x="151" y="423" width="84" height="38" rx="5" fill="#111827" stroke="#94a3b8"/>
    <text x="170" y="446" class="chip">CP2102</text>
    <rect x="170" y="483" width="46" height="16" rx="3" fill="#cbd5e1"/>
    <g fill="#fbbf24">
      <circle cx="111" cy="300" r="3"/><circle cx="111" cy="316" r="3"/><circle cx="111" cy="332" r="3"/><circle cx="111" cy="348" r="3"/><circle cx="111" cy="364" r="3"/><circle cx="111" cy="380" r="3"/><circle cx="111" cy="396" r="3"/><circle cx="111" cy="412" r="3"/><circle cx="111" cy="428" r="3"/><circle cx="111" cy="444" r="3"/><circle cx="111" cy="460" r="3"/><circle cx="111" cy="476" r="3"/>
      <circle cx="277" cy="300" r="3"/><circle cx="277" cy="316" r="3"/><circle cx="277" cy="332" r="3"/><circle cx="277" cy="348" r="3"/><circle cx="277" cy="364" r="3"/><circle cx="277" cy="380" r="3"/><circle cx="277" cy="396" r="3"/><circle cx="277" cy="412" r="3"/><circle cx="277" cy="428" r="3"/><circle cx="277" cy="444" r="3"/><circle cx="277" cy="460" r="3"/><circle cx="277" cy="476" r="3"/>
    </g>
    <text x="322" y="306" class="small">VISIBLE FEATURES</text>
    <text x="322" y="336" class="body">• Micro-USB</text>
    <text x="322" y="362" class="body">• EN + BOOT buttons</text>
    <text x="322" y="388" class="body">• CP2102 USB-UART</text>
    <text x="322" y="414" class="body">• 2 × 19-pin headers</text>
    <text x="322" y="458" class="small">PROJECT FUNCTION</text>
    <text x="322" y="485" class="body">Vehicle controller</text>
    <text x="322" y="507" class="body">and host gateway</text>
  </g>

  <!-- Uno card -->
  <g filter="url(#shadow)">
    <rect x="662" y="132" width="476" height="442" rx="24" fill="#10253b" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="688" y="156" width="150" height="22" rx="11" fill="#0e7490"/>
    <text x="704" y="171" class="small">CONFIRMED BOARD FAMILY</text>
    <text x="688" y="216" class="cardtitle">Arduino Uno R3-style</text>
    <text x="688" y="241" class="body">Uno R3 form factor • DIP ATmega328P</text>

    <!-- stylized Uno -->
    <path d="M704 291h202l20 22v165H704z" fill="#087ea4" stroke="#67e8f9" stroke-width="2"/>
    <rect x="730" y="339" width="146" height="48" rx="6" fill="#101827"/>
    <text x="752" y="368" class="chip">ATmega328P-PU</text>
    <rect x="685" y="314" width="52" height="48" rx="4" fill="#cbd5e1" stroke="#64748b"/>
    <rect x="712" y="431" width="49" height="38" rx="6" fill="#111827" stroke="#94a3b8"/>
    <circle cx="897" cy="447" r="12" fill="#c95f22" stroke="#fb923c"/>
    <g fill="#111827">
      <rect x="745" y="302" width="150" height="12" rx="3"/>
      <rect x="774" y="466" width="118" height="12" rx="3"/>
    </g>
    <text x="956" y="306" class="small">REFERENCE CAPABILITY</text>
    <text x="956" y="336" class="body">• 16 MHz MCU</text>
    <text x="956" y="362" class="body">• 14 digital I/O</text>
    <text x="956" y="388" class="body">• 6 PWM outputs</text>
    <text x="956" y="414" class="body">• 6 analog inputs</text>
    <text x="956" y="458" class="small">PROJECT FUNCTION</text>
    <text x="956" y="485" class="body">Auxiliary embedded</text>
    <text x="956" y="507" class="body">control electronics</text>
  </g>

  <!-- embedded control relationship -->
  <path d="M538 357H662" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 7"/>
  <circle cx="600" cy="357" r="31" fill="#422006" stroke="#fbbf24"/>
  <text x="580" y="364" class="small" fill="#fde68a">CONTROL</text>
  <text x="551" y="408" class="small" fill="#fde68a">VEHICLE SYSTEM</text>

  <rect x="62" y="606" width="1076" height="35" rx="12" fill="#0a1d30" stroke="#29445f"/>
  <text x="86" y="628" class="body">Dual-controller embedded platform documented with reproducible board and firmware configuration worksheets.</text>
</svg>
