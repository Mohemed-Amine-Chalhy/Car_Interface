<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Physical vehicle hardware topology</title>
  <desc id="desc">Top-down conceptual vehicle showing the Windows host, RPLidar, camera, ESP32-WROOM-32 board, Arduino Uno board, propulsion, steering, braking, and battery system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06162a"/>
      <stop offset="1" stop-color="#102f47"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#153c56"/>
      <stop offset="1" stop-color="#0b253a"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.4"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker>
    <style>
      .title { font: 700 34px Inter,Segoe UI,Arial,sans-serif; fill:#f8fafc; }
      .subtitle { font: 400 16px Inter,Segoe UI,Arial,sans-serif; fill:#a9bad0; }
      .heading { font: 700 17px Inter,Segoe UI,Arial,sans-serif; fill:#f8fafc; }
      .body { font: 400 13px Inter,Segoe UI,Arial,sans-serif; fill:#d5deea; }
      .small { font: 700 11px Inter,Segoe UI,Arial,sans-serif; fill:#dbeafe; letter-spacing:.6px; }
      .wire { fill:none; stroke:#67e8f9; stroke-width:3; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="675" rx="24" fill="url(#bg)"/>
  <text x="60" y="62" class="title">Physical Vehicle Platform</text>
  <text x="60" y="90" class="subtitle">Confirmed controller-board families integrated into a custom team-built chassis</text>

  <!-- Host -->
  <g filter="url(#shadow)">
    <rect x="62" y="170" width="258" height="210" rx="22" fill="#102a43" stroke="#38bdf8"/>
    <rect x="95" y="202" width="192" height="112" rx="9" fill="#071426" stroke="#64748b" stroke-width="3"/>
    <rect x="108" y="215" width="166" height="85" rx="4" fill="#0c4a6e"/>
    <path d="M78 326h226l-25 28H103z" fill="#64748b"/>
    <text x="95" y="407" class="heading">Windows host</text>
    <text x="95" y="430" class="body">UI • control • Lidar • AI perception</text>
    <text x="95" y="452" class="body">USB serial + USB/Bluetooth devices</text>
  </g>

  <!-- Car top view -->
  <g filter="url(#shadow)">
    <path d="M470 137Q600 104 730 137L792 200V538Q600 579 408 538V200Z" fill="url(#car)" stroke="#5eead4" stroke-width="2"/>
    <path d="M497 160Q600 132 703 160L748 213H452Z" fill="#164e63" opacity="0.8"/>
    <rect x="383" y="188" width="33" height="101" rx="11" fill="#111827"/>
    <rect x="784" y="188" width="33" height="101" rx="11" fill="#111827"/>
    <rect x="383" y="438" width="33" height="101" rx="11" fill="#111827"/>
    <rect x="784" y="438" width="33" height="101" rx="11" fill="#111827"/>

    <!-- lidar -->
    <circle cx="600" cy="195" r="43" fill="#0f172a" stroke="#67e8f9" stroke-width="3"/>
    <circle cx="600" cy="195" r="17" fill="#0891b2"/>
    <path d="M600 195L630 173M600 195L563 190M600 195L608 233" stroke="#a5f3fc" stroke-width="2.5"/>
    <text x="650" y="186" class="small">RPLIDAR</text>
    <text x="650" y="203" class="body">2D range sensor</text>

    <!-- camera -->
    <rect x="524" y="244" width="61" height="36" rx="7" fill="#172554" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="555" cy="262" r="10" fill="#7c3aed" stroke="#c4b5fd"/>
    <path d="M585 250l22-10v44l-22-10" fill="#8b5cf6"/>
    <text x="622" y="259" class="small">CAMERA</text>
    <text x="622" y="276" class="body">YOLO perception input</text>

    <!-- boards -->
    <rect x="463" y="319" width="160" height="100" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <rect x="484" y="339" width="118" height="44" rx="5" fill="#9aa6b2"/>
    <text x="491" y="365" font-family="Consolas,monospace" font-size="13" font-weight="700" fill="#1e293b">ESP-WROOM-32</text>
    <text x="480" y="404" class="small">VEHICLE CONTROLLER</text>

    <rect x="650" y="319" width="98" height="100" rx="14" fill="#087ea4" stroke="#67e8f9" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="665" y="345" width="68" height="24" rx="4" fill="#111827"/>
    <text x="675" y="362" font-family="Consolas,monospace" font-size="10" font-weight="700" fill="#dbeafe">ATmega328P</text>
    <text x="661" y="402" class="small">AUX CONTROLLER</text>
    <path d="M623 369H650" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 5"/>

    <!-- drive and power -->
    <rect x="463" y="451" width="285" height="63" rx="13" fill="#0f2f2e" stroke="#34d399"/>
    <text x="484" y="477" class="heading">Vehicle electronics</text>
    <text x="484" y="499" class="body">motor driver • steering • brake • battery</text>
    <path d="M543 419v32M699 419v32" stroke="#67e8f9" stroke-width="2.5"/>
  </g>

  <!-- device paths -->
  <path d="M320 225H375Q390 225 390 210H548" class="wire"/>
  <text x="334" y="214" class="small">RPLIDAR USB</text>
  <path d="M320 280H372Q390 280 390 267H514" class="wire"/>
  <text x="334" y="269" class="small">CAMERA</text>
  <path d="M320 335H388Q430 335 451 350" class="wire"/>
  <text x="334" y="324" class="small">CP2102 USB SERIAL</text>

  <!-- facts -->
  <g filter="url(#shadow)">
    <rect x="864" y="148" width="274" height="326" rx="22" fill="#102a43" stroke="#29445f"/>
    <text x="892" y="183" class="small">EVIDENCE SUMMARY</text>
    <text x="892" y="218" class="heading">Confirmed</text>
    <text x="892" y="243" class="body">• Physical car built and demonstrated</text>
    <text x="892" y="267" class="body">• Both controller-board families used</text>
    <text x="892" y="291" class="body">• RPLidar + camera software integration</text>
    <text x="892" y="329" class="heading">Historical settings</text>
    <text x="892" y="354" class="body">• 115200 baud serial</text>
    <text x="892" y="378" class="body">• 42 cm configured vehicle corridor</text>
    <text x="892" y="402" class="body">• 50 cm stop-assist default</text>
    <text x="892" y="440" class="heading">Configuration record</text>
    <text x="892" y="465" class="body">Firmware • pin map • calibration • BOM</text>
  </g>

  <rect x="62" y="601" width="1076" height="38" rx="12" fill="#0a1d30" stroke="#29445f"/>
  <text x="86" y="625" class="body">System-level topology of the demonstrated vehicle and its documented software interfaces.</text>
</svg>
