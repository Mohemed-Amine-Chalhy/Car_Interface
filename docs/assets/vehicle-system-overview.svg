<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Car Interface vehicle system overview</title>
  <desc id="desc">Architecture diagram connecting the game controller, RPLidar, camera and YOLO pipeline, Windows host application, ESP32 and Arduino boards, and vehicle actuators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="host" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b7285"/>
      <stop offset="1" stop-color="#087f5b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#67e8f9"/>
    </marker>
    <style>
      .title { font: 700 34px Inter,Segoe UI,Arial,sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 16px Inter,Segoe UI,Arial,sans-serif; fill: #a5b4c7; }
      .heading { font: 700 18px Inter,Segoe UI,Arial,sans-serif; fill: #f8fafc; }
      .body { font: 400 13px Inter,Segoe UI,Arial,sans-serif; fill: #cbd5e1; }
      .small { font: 600 11px Inter,Segoe UI,Arial,sans-serif; fill: #dbeafe; letter-spacing: .5px; }
      .label { font: 600 12px Inter,Segoe UI,Arial,sans-serif; fill: #67e8f9; }
    </style>
  </defs>
  <rect width="1200" height="675" rx="24" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="190" fill="#0e7490" opacity="0.08"/>
  <circle cx="120" cy="620" r="230" fill="#22c55e" opacity="0.05"/>

  <text x="64" y="66" class="title">Autonomous Vehicle Control &amp; Perception Platform</text>
  <text x="64" y="94" class="subtitle">Real team-built vehicle • production-style Python host • embedded control • Lidar and AI perception</text>

  <!-- Inputs -->
  <g filter="url(#shadow)">
    <rect x="64" y="142" width="244" height="102" rx="16" fill="#102a43" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="98" cy="176" r="18" fill="#0ea5e9" opacity="0.22"/>
    <path d="M88 177h20M98 167v20M115 174h4M121 180h4" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    <text x="132" y="174" class="heading">Game controller</text>
    <text x="86" y="207" class="body">Steering • throttle • brake • direction</text>
    <rect x="86" y="218" width="78" height="18" rx="9" fill="#0c4a6e"/>
    <text x="98" y="231" class="small">HISTORICAL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="268" width="244" height="102" rx="16" fill="#102a43" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="99" cy="301" r="19" fill="none" stroke="#67e8f9" stroke-width="3"/>
    <circle cx="99" cy="301" r="4" fill="#67e8f9"/>
    <path d="M99 301L112 289M99 301L81 299M99 301L103 319" stroke="#67e8f9" stroke-width="2"/>
    <text x="132" y="299" class="heading">RPLidar</text>
    <text x="86" y="333" class="body">2D scan • corridor geometry • proximity</text>
    <rect x="86" y="344" width="84" height="18" rx="9" fill="#064e3b"/>
    <text x="98" y="357" class="small">MAINTAINED</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="394" width="244" height="102" rx="16" fill="#102a43" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="82" y="418" width="36" height="27" rx="5" fill="none" stroke="#c4b5fd" stroke-width="3"/>
    <circle cx="100" cy="431.5" r="6" fill="#8b5cf6"/>
    <path d="M118 424l12-7v29l-12-7" fill="#c4b5fd"/>
    <text x="145" y="425" class="heading">Camera + YOLO11n</text>
    <text x="86" y="459" class="body">Object boxes • classes • confidence</text>
    <rect x="86" y="470" width="78" height="18" rx="9" fill="#4c1d95"/>
    <text x="98" y="483" class="small">HISTORICAL</text>
  </g>

  <!-- Host -->
  <g filter="url(#shadow)">
    <rect x="405" y="176" width="346" height="284" rx="24" fill="url(#host)" stroke="#5eead4" stroke-width="2"/>
    <rect x="431" y="201" width="294" height="54" rx="12" fill="#042f2e" opacity="0.62"/>
    <text x="455" y="226" class="small">WINDOWS-FIRST DESKTOP HOST</text>
    <text x="455" y="248" class="heading">Car Interface</text>

    <rect x="431" y="279" width="135" height="60" rx="12" fill="#022c22" opacity="0.65"/>
    <text x="448" y="303" class="heading">Control</text>
    <text x="448" y="324" class="body">typed commands</text>
    <rect x="590" y="279" width="135" height="60" rx="12" fill="#022c22" opacity="0.65"/>
    <text x="607" y="303" class="heading">Devices</text>
    <text x="607" y="324" class="body">serial • pygame</text>
    <rect x="431" y="353" width="135" height="60" rx="12" fill="#022c22" opacity="0.65"/>
    <text x="448" y="377" class="heading">Perception</text>
    <text x="448" y="398" class="body">Lidar • vision</text>
    <rect x="590" y="353" width="135" height="60" rx="12" fill="#022c22" opacity="0.65"/>
    <text x="607" y="377" class="heading">Operator UI</text>
    <text x="607" y="398" class="body">state • logs • plots</text>
    <text x="431" y="441" class="body">Simulation • strict typing • regression tests • CI</text>
  </g>

  <!-- Embedded and actuation -->
  <g filter="url(#shadow)">
    <rect x="850" y="140" width="286" height="112" rx="16" fill="#172554" stroke="#818cf8" stroke-width="1.5"/>
    <text x="874" y="172" class="small">CONFIRMED COMPONENT</text>
    <text x="874" y="200" class="heading">ESP32-WROOM-32 + CP2102</text>
    <text x="874" y="224" class="body">USB serial and embedded vehicle control</text>
    <rect x="1021" y="158" width="91" height="21" rx="10" fill="#312e81"/>
    <text x="1034" y="173" class="small">INSTALLED</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="280" width="286" height="98" rx="16" fill="#172554" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="874" y="311" class="small">CONFIRMED COMPONENT</text>
    <text x="874" y="338" class="heading">Arduino Uno / ATmega328P</text>
    <text x="874" y="360" class="body">ATmega328P auxiliary control electronics</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="406" width="286" height="108" rx="16" fill="#14213d" stroke="#34d399" stroke-width="1.5"/>
    <text x="874" y="438" class="small">PHYSICAL VEHICLE</text>
    <text x="874" y="466" class="heading">Actuator electronics</text>
    <text x="874" y="490" class="body">Propulsion • steering • brake</text>
  </g>

  <!-- Connections -->
  <path d="M308 193H380Q395 193 395 208V263" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M308 319H380Q395 319 395 319" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M308 445H380Q395 445 395 430V379" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="330" y="184" class="label">pygame</text>
  <text x="328" y="308" class="label">USB scan</text>
  <text x="328" y="436" class="label">frames</text>

  <path d="M751 252H820Q835 252 835 222H841" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="763" y="241" class="label">USB serial</text>
  <path d="M993 252V270" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="1005" y="268" class="label" fill="#fbbf24">vehicle control</text>
  <path d="M993 378V397" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="64" y="566" width="1072" height="52" rx="14" fill="#0f2138" stroke="#29445f"/>
  <text x="88" y="589" class="heading">Demonstrated multidisciplinary system</text>
  <text x="88" y="609" class="body">Physical vehicle • embedded control • desktop software • Lidar geometry • YOLO perception</text>
</svg>
