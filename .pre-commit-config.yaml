minimum_pre_commit_version: "4.0.0"
default_install_hook_types:
  - pre-commit
  - pre-push
default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=no"]
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: uv-lock-check
        name: verify uv lockfile
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: ruff-check
        name: ruff lint
        entry: uv run --locked --group dev ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --locked --group dev ruff format
        language: system
        types: [python]
        require_serial: true

      - id: production-readiness
        name: production readiness checks
        entry: uv run --locked --group dev python scripts/dev.py check --skip-audit
        language: system
        pass_filenames: false
        stages: [pre-push]
        require_serial: true
